name: Reflex
options:
  bundleIdPrefix: com.xmanxay
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  ReflexKit:
    path: Packages/ReflexKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEAD_CODE_STRIPPING: YES
    # Ad-hoc signing: builds and runs locally with no Apple Developer account.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  ReflexSpike:
    type: application
    platform: macOS
    sources:
      - path: Spike
    dependencies:
      - package: ReflexKit
        product: ReflexPTP
    settings:
      base:
        PRODUCT_NAME: ReflexSpike
        PRODUCT_BUNDLE_IDENTIFIER: com.xmanxay.ReflexSpike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Reflex Spike
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Xay. MIT License."
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    info:
      path: Spike/Info.plist
      properties:
        # macOS's camera daemon (ptpcamerad) checks this permission before it lets an app talk to a USB camera.
        NSRemovableVolumesUsageDescription: "Reflex talks to your camera over USB to show live view and change its settings. It does not read or copy your photos."
schemes:
  ReflexSpike:
    build:
      targets:
        ReflexSpike: all
    run:
      config: Debug
